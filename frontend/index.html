<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Simulateur de forces - LameSim</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Importation du générateur de maillage Earcut via CDN -->
  <script src="https://unpkg.com/earcut@2.2.4/dist/earcut.min.js"></script>
</head>
<body>
  <h1>BladeSim</h1>
  
  <div id="controls">
    <button id="btn-draw-blade" style="background-color: #007bff; color: white;">Tracer Lame</button>
    <button id="btn-draw-obs" style="background-color: #17a2b8; color: white;">Tracer Obstacle</button>
    <button id="btn-toggle-mesh" style="background-color: #6c757d; color: white;">Masquer/Afficher Traits</button>
    <button id="btn-sim" style="background-color: #28a745; color: white;">Mode Simulation</button>
  </div>
    <div id="history-controls" style="margin-bottom: 10px; display: flex; gap: 10px;">
    <button id="btn-undo" disabled style="padding: 5px 15px; cursor: pointer;">⟲ Annuler (Ctrl+Z)</button>
    <button id="btn-redo" disabled style="padding: 5px 15px; cursor: pointer;">⟳ Rétablir (Ctrl+Y)</button>
  </div>
  <!-- Panneau de contrôle de la simulation (Timeline) -->
  <div id="timeline-container" style="display: flex; align-items: center; gap: 15px; margin-top: 10px; padding: 10px; background: #f8f9fa; border: 1px solid #ccc; border-radius: 5px;">
    
    <button id="btn-start-stream" style="background-color: #dc3545; color: white; padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">Connecter WebSocket</button>
    
    <div style="font-size: 13px; min-width: 120px; line-height: 1.4;">
      <span id="ws-status" style="color: #6c757d; font-weight: bold;">● Hors ligne</span><br>
      <span id="buffer-size">0 frames en cache</span>
    </div>

    <!-- Le curseur temporel (désactivé tant qu'il n'y a pas de données) -->
    <input type="range" id="sim-slider" min="0" max="0" value="0" step="1" style="flex-grow: 1; cursor: pointer;" disabled>
    
    <div style="font-size: 14px; min-width: 80px; text-align: right;">
      <strong id="sim-displacement">0.00 cm</strong>
    </div>
  </div>

  <div id="main-container">
    <!-- Panneau d'information latéral -->
    <aside id="info-panel">
      <h3>Données du Modèle</h3>
      <div id="data-content">
        <p>Aucun point tracé.</p>
      </div>
      <!-- Paramètres physiques de la lame -->
      <div id="physics-settings" style="margin-top: 15px; padding-top: 15px; border-top: 1px solid #ccc;">
        <h4 style="margin-top: 0;">Propriétés Physiques</h4>
        
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px;">
          <label for="input-mass" style="font-size: 13px;">Masse (kg) :</label>
          <input type="number" id="input-mass" step="0.1" value="1.0" style="width: 60px; text-align: center;">
        </div>
        
        <button id="btn-calc-mass" style="width: 100%; font-size: 12px; padding: 5px; background-color: #e2e3e5; border: 1px solid #ced4da; cursor: pointer;">
          Calcul Auto (Acier 5mm)
        </button>

        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px;">
        <label for="input-vx" style="font-size: 13px;">Vitesse X (px/s) :</label>
        <input type="number" id="input-vx" step="1" value="0" style="width: 60px; text-align: center;">
      </div>
      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px;">
        <label for="input-vy" style="font-size: 13px;">Vitesse Y (px/s) :</label>
        <input type="number" id="input-vy" step="1" value="100" style="width: 60px; text-align: center;">
      </div>

      </div>
    </aside>

    <!-- Conteneur de simulation -->
    <div id="canvas-container">
      <canvas id="canvas"></canvas>
    </div>
    

  </div>

  <script src="script.js"></script>
</body>
</html>
